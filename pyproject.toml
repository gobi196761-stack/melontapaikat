[project]
name = "osm-melontatilanne"
version = "1.0.0"
description = "osm.fi-melontapaikkojen päivän tilanne SYKE:n vesikaavioista ja paikkojen optimijärjestys"
requires-python = ">=3.10"
dependencies = ["pillow>=10", "numpy>=1.24", "tzdata>=2024.1"]

[dependency-groups]
dev = ["pytest>=8", "pyflakes>=3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
